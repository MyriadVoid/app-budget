<!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Budget</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
  </head>
  <body>

    <div id="badge-budget-depart"></div>

    <header>
      <h1>Mon Budget</h1>
    </header>

    <section id="resume">
    <h2>Résumé du mois</h2>
    <p>Salaire : <span id="valeur-salaire">0</span> €</p>

    <h3>Charges fixes</h3>
    <ul id="liste-charges"></ul>
    <p>Total charges : <span id="valeur-charges">0</span> €</p>

    <p>Épargne : <span id="valeur-epargne">0</span> €</p>
    <p>Reste à vivre : <span id="valeur-reste">0</span> €</p>
    <p><strong>Budget du jour : <span id="valeur-budget-jour">0</span> €</strong></p>
  </section>

    <details id="saisie-mois">
      <summary>Nouveau mois</summary>
      <label for="input-salaire">Salaire reçu</label>
      <input type="number" id="input-salaire" placeholder="ex: 2500">

      <label for="input-epargne">Épargne mise de côté</label>
      <input type="number" id="input-epargne" placeholder="ex: 300">

      <button id="btn-valider-mois">Valider le mois</button>
    </details>

    <section id="depense-jour">
      <h2>Dépense d'aujourd'hui</h2>
      <input type="number" id="input-depense" placeholder="ex: 12.50">
      <button id="btn-ajouter-depense">Ajouter</button>
    </section>

    <details id="ajustement">
      <summary>Ajuster selon mon compte</summary>
      <label for="input-solde-reel">Solde réel sur mon compte</label>
      <input type="number" id="input-solde-reel" placeholder="ex: 430">
      <button id="btn-ajuster-solde">Ajuster</button>
    </details>

    <section id="historique">
      <h2>Historique</h2>
      <ul id="liste-depenses">
        <!-- les dépenses seront ajoutées ici par JavaScript -->
      </ul>
    </section>

    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js");
        });
      }
    </script>
  </body>
  </html>
