<!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Budget</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
  </head>
  <body>

    <div id="bordure-ecran"></div>

    <div id="badge-budget-depart"></div>
    <button id="btn-theme" aria-label="Changer de theme"></button>

    <header>
      <h1>Mon Budget</h1>
    </header>

    <section id="resume">
    <h2>Résumé du mois</h2>
    <p>
      <span>Salaire</span>
      <span class="valeur-avec-fleche"><span id="valeur-salaire">0</span> CHF</span>
    </p>

    <details class="ligne-resume" id="section-epargne-resume">
      <summary>
        <span>Épargne</span>
        <span class="valeur-avec-fleche"><span id="valeur-epargne">0</span> CHF</span>
        <span class="fleche">▾</span>
      </summary>
      <ul id="liste-epargne"></ul>
    </details>

    <details class="ligne-resume" id="section-charges-resume">
      <summary>
        <span>Charges fixes</span>
        <span class="valeur-avec-fleche"><span id="valeur-charges">0</span> CHF</span>
        <span class="fleche">▾</span>
      </summary>
      <ul id="liste-charges"></ul>
    </details>

    <p>
      <span>Reste à vivre</span>
      <span class="valeur-avec-fleche"><span id="valeur-reste">0</span> CHF</span>
    </p>
    <p class="ligne-budget-jour">
      <span id="label-budget-jour">Budget du jour</span>
      <span class="valeur-avec-fleche" id="valeur-budget-jour-wrapper"><span id="valeur-budget-jour">0</span> CHF</span>
    </p>
  </section>

    <section id="depense-jour">
      <h2>Dépense d'aujourd'hui</h2>
      <input type="number" id="input-depense" placeholder="ex: 12.50">
      <button id="btn-ajouter-depense">Ajouter</button>
    </section>

    <div class="grille-onglets">
      <details id="gestion-charges">
        <summary>Charges</summary>
        <label for="input-nom-charge">Nom de la charge</label>
        <input type="text" id="input-nom-charge" placeholder="ex: Loyer">

        <label for="input-montant-charge">Montant</label>
        <input type="number" id="input-montant-charge" placeholder="ex: 800">

        <button id="btn-ajouter-charge">Ajouter</button>
      </details>

      <details id="ajout-epargne">
        <summary>Épargne</summary>
        <label for="input-montant-epargne">Montant mis de côté</label>
        <input type="number" id="input-montant-epargne" placeholder="ex: 100">

        <button id="btn-ajouter-epargne">Ajouter</button>
      </details>

      <details id="saisie-mois">
        <summary>Nouveau mois</summary>
        <label for="input-salaire">Salaire reçu</label>
        <input type="number" id="input-salaire" placeholder="ex: 2500">

        <button id="btn-valider-mois">Valider</button>
      </details>

      <details id="ajustement">
        <summary>Ajuster</summary>
        <label for="input-solde-reel">Solde réel sur mon compte</label>
        <input type="number" id="input-solde-reel" placeholder="ex: 430">
        <button id="btn-ajuster-solde">Ajuster</button>
      </details>
    </div>

    <details id="historique">
      <summary>Historique</summary>
      <ul id="liste-depenses">
        <!-- les dépenses seront ajoutées ici par JavaScript -->
      </ul>
    </details>

    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js");
        });
      }
    </script>
  </body>
  </html>
